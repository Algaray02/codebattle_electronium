name: Deploy to RupaCloud (Laravel (Blade / Inertia React))

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Auto-Deploy to Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH to RupaCloud Container & Deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: APP_ENV_CONTENT
          script: |
            # 1. Pastikan folder ~/app tersedia dan clone/pull dari branch main
            set -e
            export GIT_TERMINAL_PROMPT=0
            TARGET_REPO="${{ github.repository }}"
            CURRENT_REPO="$(cd ~/app 2>/dev/null && git config --get remote.origin.url 2>/dev/null || true)"
            if [ ! -d ~/app/.git ] || ! echo "$CURRENT_REPO" | grep -q "$TARGET_REPO"; then
              rm -rf ~/app
              git clone --depth 1 -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/app
              cd ~/app
            else
              cd ~/app
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --depth 1 origin main
              git checkout -B main FETCH_HEAD
              git reset --hard FETCH_HEAD
              git clean -fd
            fi
            # 2. Inject environment variables dari GitHub Secret (APP_ENV)
            if [ -n "$APP_ENV_CONTENT" ]; then
              echo "$APP_ENV_CONTENT" > .env
            fi
            # 3. Install dependensi
            composer install --no-interaction --prefer-dist --optimize-autoloader; if [ -f package.json ]; then npm install; fi
            if [ -f prisma/schema.prisma ] || grep -q 'prisma' package.json 2>/dev/null; then
              npx prisma generate 2>/dev/null || true
            fi
            # 4. Build application
            export NODE_OPTIONS="--max-old-space-size=1200"
            if [ -f package.json ]; then NODE_OPTIONS='--max-old-space-size=1200' npm run build; fi; chmod -R 775 storage bootstrap/cache; php artisan storage:link 2>/dev/null || true; php artisan key:generate --force 2>/dev/null || true; if grep -q 'DB_CONNECTION=sqlite' .env 2>/dev/null; then touch database/database.sqlite 2>/dev/null || true; fi; php artisan migrate --force 2>/dev/null || true; php artisan config:cache 2>/dev/null || true; php artisan route:cache 2>/dev/null || true; php artisan view:cache 2>/dev/null || true
            # 5. Konfigurasi Nginx reverse proxy ke port 3000 (jika Nginx terpasang)
            if which nginx >/dev/null 2>&1; then
              cat << 'NGINX_EOF' > /etc/nginx/sites-available/default
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX_EOF
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi
            # 6. Menjalankan / merestart aplikasi
            pm2 delete app 2>/dev/null || true
            pm2 delete app 2>/dev/null || true; pm2 start "php artisan serve --host=0.0.0.0 --port=3000" --name app
            pm2 save 2>/dev/null || true
